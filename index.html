<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Daily Tasks</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My Daily Tasks</h1>
      <p class="subtitle">Stay organized. One task at a time.</p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <label for="task-input" class="visually-hidden">New task</label>
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
      >
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>
    <p id="error-message" class="error" role="alert" hidden>Please enter a task.</p>

    <section class="toolbar" aria-label="Task filters">
      <div class="filters" id="filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </section>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state" hidden>No tasks here. Add one above! 🎉</p>

    <footer class="app-footer">
      <span id="counter" class="counter" aria-live="polite">0 tasks left</span>
      <button type="button" id="clear-completed" class="btn btn-ghost">Clear Completed</button>
    </footer>
  </main>
</body>
</html>
